# Cloudflare Worker for the Markon free trial. Not deployed from this repo yet.
# Secrets (never in this file): `wrangler secret put ANTHROPIC_API_KEY` and `wrangler secret put JWT_SECRET`.
name = "markon-relay"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Quotas, usage and the abuse config (key "config", JSON) live in KV so they change without a deploy.
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
