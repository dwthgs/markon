[graph]
targets = ["aarch64-apple-darwin"]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates pulled in by Tauri's GTK/webkit stack do not build on macOS; only flag what we ship.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "BSL-1.0", "0BSD", "CDLA-Permissive-2.0", "bzip2-1.0.6",
]

unused-allowed-license = "allow"

# Our own crates are unpublished (publish = false) and proprietary.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
