[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/provider", "crates/agent", "crates/platform", "crates/audio", "crates/tools", "crates/memory", "crates/scheduler"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-build = { version = "=2.7.4", features = [] }
tauri-plugin-global-shortcut = "=2.4.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
cpal = "=0.18.2"
rubato = "=5.0.1"
whisper-rs = "=0.16.0"
ort = { version = "=2.0.0-rc.15" }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
keyring = { version = "=4.2.0" }
rmcp = { version = "=3.9.0" }
croner = "=4.0.3"
webrtc-audio-processing = "=2.1.0"
thiserror = "=2.0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
